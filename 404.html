<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/favi-icon.png" />
  <link rel="apple-touch-icon" href="images/favi-icon.png" />
  <link rel="shortcut icon" href="images/favi-icon.png" />

  <title>Page Not Found - Ulikhaya Mazibuko</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Non-blocking fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </noscript>

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-surface-dark);
      position: relative;
      overflow: hidden;
      padding: var(--space-8);
    }

    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-6);
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: var(--weight-bold);
      color: var(--color-text-on-dark);
      line-height: 1;
      letter-spacing: var(--tracking-tight);
      opacity: 0.08;
      user-select: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .error-label {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .error-headline {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: var(--weight-bold);
      color: var(--color-text-on-dark);
      line-height: var(--leading-snug);
      letter-spacing: var(--tracking-tight);
    }

    .error-body {
      color: var(--color-text-on-dark-muted);
      line-height: var(--leading-relaxed);
      max-width: 420px;
    }

    .error-actions {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      justify-content: center;
      margin-top: var(--space-4);
    }

    .error-links {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-border-dark);
      width: 100%;
    }

    .error-links-label {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-text-on-dark-muted);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      margin-bottom: var(--space-2);
    }

    .error-links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      justify-content: center;
    }

    .error-link {
      font-size: var(--text-sm);
      color: var(--color-text-on-dark-muted);
      text-decoration: none;
      transition: color var(--transition-fast);
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--color-border-dark);
      border-radius: var(--radius-md);
    }

    .error-link:hover {
      color: var(--color-accent);
      border-color: var(--color-accent);
    }
  </style>
</head>
<body>

  <div class="error-page">

    <!-- Large background number -->
    <span class="error-code" aria-hidden="true">404</span>

    <div class="error-container">

      <span class="error-label">Error 404 — Page not found</span>

      <h1 class="error-headline">
        This page doesn't exist.<br />
        <span style="color: var(--color-accent);">Yet.</span>
      </h1>

      <p class="body-lg error-body">
        The page you're looking for may have moved, been renamed,
        or never existed in the first place. Let's get you back
        somewhere useful.
      </p>

      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">Back to Home</a>
        <a href="services.html" class="btn btn-secondary">View Services</a>
      </div>

      <div class="error-links">
        <span class="error-links-label">Or go directly to</span>
        <div class="error-links-grid">
          <a href="about.html" class="error-link">About</a>
          <a href="portfolio.html" class="error-link">Portfolio</a>
          <a href="index.html#contact" class="error-link">Contact</a>
        </div>
      </div>

    </div>

  </div>

  <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <script src="js/main.js"></script>
</body>
</html>
